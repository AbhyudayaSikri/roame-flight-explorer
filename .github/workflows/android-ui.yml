name: android-ui

# Compose UI tests on an API 37 emulator, against the real local API (.github/scripts/android-ui-tests.sh).
# Required for pull requests that touch androidApp/ or shared/ (CLAUDE.md, Merging).
on:
  push:
    branches: [main]
    paths:
      - 'androidApp/**'
      - 'shared/**'
      - 'server/**'
      - 'fixtures/**'
      - 'gradle/**'
      - '*.gradle.kts'
      - 'gradle.properties'
      - '.github/workflows/android-ui.yml'
      - '.github/scripts/android-ui-tests.sh'
  pull_request:
    paths:
      - 'androidApp/**'
      - 'shared/**'
      - 'server/**'
      - 'fixtures/**'
      - 'gradle/**'
      - '*.gradle.kts'
      - 'gradle.properties'
      - '.github/workflows/android-ui.yml'
      - '.github/scripts/android-ui-tests.sh'
  workflow_dispatch:

concurrency:
  group: android-ui-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  emulator:
    name: Android emulator smoke tests (Linux)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'

      - uses: gradle/actions/setup-gradle@v6

      - name: Build the app, its UI tests and the server jar
        run: ./gradlew --console=plain :androidApp:assembleDebug :androidApp:assembleDebugAndroidTest :server:fatJar

      # Hardware acceleration for the emulator, as android-emulator-runner's README sets it up.
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # The emulator reaches it as 10.0.2.2:8080, the debug build's default base URL.
      - name: Start the local API
        run: |
          java -jar server/build/libs/roame-flights-server.jar --mode=normal --port=8080 > "$RUNNER_TEMP/server.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/server.pid"
          for _ in $(seq 1 30); do curl -fsS http://127.0.0.1:8080/health > /dev/null 2>&1 && break; sleep 1; done
          curl -fsS http://127.0.0.1:8080/health

      - name: UI tests on the emulator (API 37)
        uses: reactivecircus/android-emulator-runner@v2.38.0
        with:
          api-level: '37.0'
          target: google_apis
          arch: x86_64
          profile: pixel_7
          cores: 4
          ram-size: 4096M
          # The default data partition can't fit the 57 MB debug APK ("not enough space").
          disk-size: 6000M
          emulator-boot-timeout: 900
          # With this host feature on, the API 37 image's graphics mapper aborts SurfaceFlinger
          # ("Assertion failed: !rcEnc->featureInfo()->hasReadColorBufferDma"), which restarts the system.
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none -feature -ReadColorBufferDma
          disable-animations: true
          script: .github/scripts/android-ui-tests.sh

      - name: Upload results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: android-ui-tests
          path: |
            ${{ runner.temp }}/android-ui/
            ${{ runner.temp }}/server.log
          if-no-files-found: ignore
          retention-days: 14
