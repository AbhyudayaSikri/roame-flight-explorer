name: ios

on:
  push:
    branches: [main, overnight]
    paths:
      - 'iosApp/**'
      - 'shared/**'
      - 'server/**'
      - 'fixtures/**'
      - 'gradle/**'
      - '*.gradle.kts'
      - 'gradle.properties'
      - '.github/workflows/ios.yml'
  pull_request:
    paths:
      - 'iosApp/**'
      - 'shared/**'
      - 'server/**'
      - 'fixtures/**'
      - 'gradle/**'
      - '*.gradle.kts'
      - 'gradle.properties'
      - '.github/workflows/ios.yml'
  workflow_dispatch:

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Top of Kotlin 2.4.21's tested range; the image's default Xcode (26.6) is newer than that.
  XCODE_APP: /Applications/Xcode_26.4.1.app
  # Must match the version used to generate the committed project (see iosApp/project.yml).
  XCODEGEN_VERSION: 2.46.0

jobs:
  ios:
    name: iOS build and UI tests (macOS)
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - name: Select Xcode
        run: |
          sudo xcode-select -s "$XCODE_APP"
          xcodebuild -version

      - name: Install XcodeGen
        run: |
          curl -fsSL -o "$RUNNER_TEMP/xcodegen.zip" \
            "https://github.com/yonaskolb/XcodeGen/releases/download/$XCODEGEN_VERSION/xcodegen.zip"
          unzip -q "$RUNNER_TEMP/xcodegen.zip" -d "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/xcodegen/bin" >> "$GITHUB_PATH"

      - name: Check the committed Xcode project matches project.yml
        run: |
          xcodegen --version
          xcodegen generate --spec iosApp/project.yml
          if [ -n "$(git status --porcelain -- iosApp)" ]; then
            echo "::error::iosApp/RoameStarter.xcodeproj is out of date. Run 'xcodegen generate --spec iosApp/project.yml' and commit the result."
            git status --porcelain -- iosApp
            git diff -- iosApp | head -200
            exit 1
          fi

      # The Xcode build phase runs Gradle; JDK 25 matches gradle/gradle-daemon-jvm.properties.
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'

      - uses: gradle/actions/setup-gradle@v6

      - name: Cache the Kotlin/Native toolchain
        uses: actions/cache@v6
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ runner.arch }}-kotlin-2.4.21

      - name: Create and boot the simulator (iPhone 17, iOS 26.4)
        id: sim
        run: |
          RUNTIME=$(xcrun simctl list runtimes -j | jq -r '[.runtimes[] | select(.platform == "iOS" and .isAvailable and (.version | startswith("26.4")))][0].identifier')
          if [ -z "$RUNTIME" ] || [ "$RUNTIME" = "null" ]; then
            echo "::error::No iOS 26.4 simulator runtime on this image"
            xcrun simctl list runtimes
            exit 1
          fi
          UDID=$(xcrun simctl create ci-iphone "iPhone 17" "$RUNTIME")
          echo "runtime=$RUNTIME udid=$UDID"
          xcrun simctl boot "$UDID"
          xcrun simctl bootstatus "$UDID" -b
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"

      - name: Shared tests on the simulator
        env:
          UDID: ${{ steps.sim.outputs.udid }}
        run: |
          ./gradlew --console=plain :shared:iosSimulatorArm64Test --device "$UDID"
          RESULTS=$(find shared/build/test-results/iosSimulatorArm64Test -name '*.xml' 2>/dev/null | wc -l | tr -d ' ')
          if [ "$RESULTS" = "0" ]; then
            echo "::error::iosSimulatorArm64Test wrote no test results, so the tests didn't run."
            exit 1
          fi
          echo "- Shared Kotlin tests ran on the simulator ($RESULTS result files)" >> "$GITHUB_STEP_SUMMARY"

      - name: Build for testing
        env:
          UDID: ${{ steps.sim.outputs.udid }}
        run: |
          set -o pipefail
          mkdir -p build/ci
          xcodebuild build-for-testing -project iosApp/RoameStarter.xcodeproj -scheme RoameStarter \
            -configuration Debug -destination "id=$UDID" -derivedDataPath build/dd \
            | tee build/ci/build-for-testing.log | xcbeautify --renderer github-actions

      - name: UI tests
        env:
          UDID: ${{ steps.sim.outputs.udid }}
        run: |
          set -o pipefail
          xcodebuild test-without-building -project iosApp/RoameStarter.xcodeproj -scheme RoameStarter \
            -destination "id=$UDID" -derivedDataPath build/dd \
            -skip-testing:RoameStarterUITests/PersistenceProbeTests \
            -resultBundlePath build/ci/ui-tests.xcresult \
            | tee build/ci/ui-tests.log | xcbeautify --renderer github-actions

      # Does the app's data container survive separate test-without-building runs on one simulator?
      - name: Persistence probe, run 1 (reset, record one launch)
        env:
          UDID: ${{ steps.sim.outputs.udid }}
        run: |
          set -o pipefail
          xcodebuild test-without-building -project iosApp/RoameStarter.xcodeproj -scheme RoameStarter \
            -destination "id=$UDID" -derivedDataPath build/dd \
            -only-testing:RoameStarterUITests/PersistenceProbeTests/testFirstLaunch \
            -resultBundlePath build/ci/probe-run-1.xcresult \
            | tee build/ci/probe-run-1.log | xcbeautify --renderer github-actions

      - name: Persistence probe, run 2 (read the count in a new xcodebuild run)
        env:
          UDID: ${{ steps.sim.outputs.udid }}
        run: |
          set -o pipefail
          xcodebuild test-without-building -project iosApp/RoameStarter.xcodeproj -scheme RoameStarter \
            -destination "id=$UDID" -derivedDataPath build/dd \
            -only-testing:RoameStarterUITests/PersistenceProbeTests/testSecondLaunch \
            -resultBundlePath build/ci/probe-run-2.xcresult \
            | tee build/ci/probe-run-2.log | xcbeautify --renderer github-actions
          COUNT=$(grep -o 'PERSISTENCE_PROBE launchCount=[0-9a-z]*' build/ci/probe-run-2.log | tail -1 | cut -d= -f2 || true)
          if [ -z "$COUNT" ]; then
            mkdir -p build/ci/probe-attachments
            xcrun xcresulttool export attachments --path build/ci/probe-run-2.xcresult \
              --output-path build/ci/probe-attachments > /dev/null
            COUNT=$(grep -rho 'PERSISTENCE_PROBE launchCount=[0-9a-z]*' build/ci/probe-attachments | tail -1 | cut -d= -f2 || true)
          fi
          case "$COUNT" in
            2) RESULT="yes, the data written in run 1 was still there in run 2" ;;
            1) RESULT="no, run 2 started with an empty data container" ;;
            *) echo "::error::The persistence probe didn't report a launch count (got '$COUNT')"; exit 1 ;;
          esac
          echo "::notice title=Persistence probe::App data survives separate test-without-building runs: $RESULT (launchCount=$COUNT)"
          echo "- App data survives separate \`xcodebuild test-without-building\` runs: $RESULT (launchCount=$COUNT)" >> "$GITHUB_STEP_SUMMARY"

      - name: Export screenshots
        if: always()
        run: |
          for result in build/ci/*.xcresult; do
            [ -d "$result" ] || continue
            name=$(basename "$result" .xcresult)
            mkdir -p "build/ci/screenshots/$name"
            xcrun xcresulttool export attachments --path "$result" --output-path "build/ci/screenshots/$name"
          done

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ios-ui-tests
          path: |
            build/ci/*.log
            build/ci/*.xcresult
            build/ci/screenshots
            shared/build/reports/tests/iosSimulatorArm64Test/
          if-no-files-found: ignore
          retention-days: 14
