name: ios

on:
  push:
    branches: [main]
    paths:
      - 'iosApp/**'
      - 'shared/**'
      - 'server/**'
      - 'fixtures/**'
      - 'gradle/**'
      - '*.gradle.kts'
      - 'gradle.properties'
      - '.github/workflows/ios.yml'
  pull_request:
    paths:
      - 'iosApp/**'
      - 'shared/**'
      - 'server/**'
      - 'fixtures/**'
      - 'gradle/**'
      - '*.gradle.kts'
      - 'gradle.properties'
      - '.github/workflows/ios.yml'
  workflow_dispatch:

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Top of Kotlin 2.4.21's tested range; the image's default Xcode (26.6) is newer than that.
  XCODE_APP: /Applications/Xcode_26.4.1.app
  # Must match the version used to generate the committed project (see iosApp/project.yml).
  XCODEGEN_VERSION: 2.46.0

jobs:
  ios:
    name: iOS build and UI tests (macOS)
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - name: Select Xcode
        run: |
          sudo xcode-select -s "$XCODE_APP"
          xcodebuild -version

      - name: Install XcodeGen
        run: |
          curl -fsSL -o "$RUNNER_TEMP/xcodegen.zip" \
            "https://github.com/yonaskolb/XcodeGen/releases/download/$XCODEGEN_VERSION/xcodegen.zip"
          unzip -q "$RUNNER_TEMP/xcodegen.zip" -d "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/xcodegen/bin" >> "$GITHUB_PATH"

      - name: Check the committed Xcode project matches project.yml
        run: |
          xcodegen --version
          xcodegen generate --spec iosApp/project.yml
          if [ -n "$(git status --porcelain -- iosApp)" ]; then
            echo "::error::iosApp/RoameStarter.xcodeproj is out of date. Run 'xcodegen generate --spec iosApp/project.yml' and commit the result."
            git status --porcelain -- iosApp
            git diff -- iosApp | head -200
            exit 1
          fi

      # The Xcode build phase runs Gradle; JDK 25 matches gradle/gradle-daemon-jvm.properties.
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'

      - uses: gradle/actions/setup-gradle@v6

      - name: Cache the Kotlin/Native toolchain
        uses: actions/cache@v6
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ runner.arch }}-kotlin-2.4.21

      - name: Create and boot the simulator (iPhone 17, iOS 26.4)
        id: sim
        run: |
          RUNTIME=$(xcrun simctl list runtimes -j | jq -r '[.runtimes[] | select(.platform == "iOS" and .isAvailable and (.version | startswith("26.4")))][0].identifier')
          if [ -z "$RUNTIME" ] || [ "$RUNTIME" = "null" ]; then
            echo "::error::No iOS 26.4 simulator runtime on this image"
            xcrun simctl list runtimes
            exit 1
          fi
          UDID=$(xcrun simctl create ci-iphone "iPhone 17" "$RUNTIME")
          echo "runtime=$RUNTIME udid=$UDID"
          xcrun simctl boot "$UDID"
          xcrun simctl bootstatus "$UDID" -b
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"

      - name: Shared tests on the simulator
        env:
          UDID: ${{ steps.sim.outputs.udid }}
        run: |
          ./gradlew --console=plain :shared:iosSimulatorArm64Test --device "$UDID"
          RESULTS=$(find shared/build/test-results/iosSimulatorArm64Test -name '*.xml' 2>/dev/null | wc -l | tr -d ' ')
          if [ "$RESULTS" = "0" ]; then
            echo "::error::iosSimulatorArm64Test wrote no test results, so the tests didn't run."
            exit 1
          fi
          echo "- Shared Kotlin tests ran on the simulator ($RESULTS result files)" >> "$GITHUB_STEP_SUMMARY"

      - name: Start the local API (control endpoint on)
        run: |
          mkdir -p build/ci
          ./gradlew --console=plain :server:installDist
          nohup server/build/install/server/bin/server --mode=normal --port=8080 --allow-control \
            > build/ci/server.log 2>&1 &
          echo $! > build/ci/server.pid
          for _ in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8080/health > /dev/null 2>&1; then
              # DebugMenuTests point the app at a plain-HTTP IP address, like a phone on the same Wi-Fi.
              IP=$(ipconfig getifaddr en0 2>/dev/null || ipconfig getifaddr en1 2>/dev/null || true)
              if [ -n "$IP" ] && curl -fsS "http://$IP:8080/health" > /dev/null 2>&1; then
                echo "TEST_RUNNER_LAN_SERVER_URL=http://$IP:8080" >> "$GITHUB_ENV"
                echo "- The API also answers on the LAN address http://$IP:8080 (used by DebugMenuTests)" >> "$GITHUB_STEP_SUMMARY"
              else
                echo "TEST_RUNNER_LAN_SERVER_URL=http://127.0.0.1:8080" >> "$GITHUB_ENV"
                echo "::warning::No LAN address answered; DebugMenuTests use http://127.0.0.1:8080"
              fi
              echo "API is up"
              exit 0
            fi
            sleep 1
          done
          echo "::error::The local API didn't answer /health within 60 s"
          cat build/ci/server.log
          exit 1

      - name: Build for testing
        id: build
        env:
          UDID: ${{ steps.sim.outputs.udid }}
        run: |
          set -o pipefail
          xcodebuild build-for-testing -project iosApp/RoameStarter.xcodeproj -scheme RoameStarter \
            -configuration Debug -destination "id=$UDID" -derivedDataPath build/dd \
            | tee build/ci/build-for-testing.log | xcbeautify --renderer github-actions

      # Server-mode cases switch the mode themselves through POST /control/mode.
      - name: UI tests
        env:
          UDID: ${{ steps.sim.outputs.udid }}
        run: |
          set -o pipefail
          xcodebuild test-without-building -project iosApp/RoameStarter.xcodeproj -scheme RoameStarter \
            -destination "id=$UDID" -derivedDataPath build/dd \
            -skip-testing:RoameStarterUITests/DemoWalkthrough \
            -skip-testing:RoameStarterUITests/OfflineRelaunchTests \
            -resultBundlePath build/ci/ui-tests.xcresult \
            | tee build/ci/ui-tests.log | xcbeautify --renderer github-actions

      # The demo video covers the walkthrough and the offline relaunch that follows it.
      - name: Start recording the demo
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        env:
          UDID: ${{ steps.sim.outputs.udid }}
        run: |
          nohup xcrun simctl io "$UDID" recordVideo --codec=h264 --force build/ci/demo.mp4 \
            > build/ci/recording.log 2>&1 &
          echo $! > build/ci/recording.pid
          sleep 3

      # App data survives separate test-without-building runs (docs/NOTES.md, persistence probe),
      # so the offline case reuses the cache and saved flight this walkthrough leaves behind.
      - name: Demo walkthrough (also seeds the offline run)
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        env:
          UDID: ${{ steps.sim.outputs.udid }}
        run: |
          set -o pipefail
          curl -fsS -X POST "http://127.0.0.1:8080/control/mode?value=normal" > /dev/null
          xcodebuild test-without-building -project iosApp/RoameStarter.xcodeproj -scheme RoameStarter \
            -destination "id=$UDID" -derivedDataPath build/dd \
            -only-testing:RoameStarterUITests/DemoWalkthrough \
            -resultBundlePath build/ci/demo-walkthrough.xcresult \
            | tee build/ci/demo-walkthrough.log | xcbeautify --renderer github-actions

      - name: Stop the local API
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          kill "$(cat build/ci/server.pid)"
          for _ in $(seq 1 30); do
            if ! curl -fsS http://127.0.0.1:8080/health > /dev/null 2>&1; then echo "API stopped"; exit 0; fi
            sleep 1
          done
          echo "::error::The local API was still answering 30 s after kill"
          exit 1

      - name: Offline relaunch tests (API stopped)
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        env:
          UDID: ${{ steps.sim.outputs.udid }}
        run: |
          set -o pipefail
          xcodebuild test-without-building -project iosApp/RoameStarter.xcodeproj -scheme RoameStarter \
            -destination "id=$UDID" -derivedDataPath build/dd \
            -only-testing:RoameStarterUITests/OfflineRelaunchTests \
            -resultBundlePath build/ci/offline-relaunch.xcresult \
            | tee build/ci/offline-relaunch.log | xcbeautify --renderer github-actions

      - name: Stop recording the demo
        if: always()
        run: |
          [ -f build/ci/recording.pid ] || exit 0
          PID=$(cat build/ci/recording.pid)
          kill -INT "$PID" 2>/dev/null || true
          for _ in $(seq 1 30); do
            kill -0 "$PID" 2>/dev/null || break
            sleep 1
          done
          ls -la build/ci/demo.mp4 || echo "::warning::No demo video was written"

      - name: Export screenshots
        if: always()
        run: |
          for result in build/ci/*.xcresult; do
            [ -d "$result" ] || continue
            name=$(basename "$result" .xcresult)
            mkdir -p "build/ci/screenshots/$name"
            xcrun xcresulttool export attachments --path "$result" --output-path "build/ci/screenshots/$name"
          done

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ios-ui-tests
          path: |
            build/ci/*.log
            build/ci/*.mp4
            build/ci/*.xcresult
            build/ci/screenshots
            shared/build/reports/tests/iosSimulatorArm64Test/
          if-no-files-found: ignore
          retention-days: 14
