name: ios

on:
  push:
    branches: [main]
    paths:
      - 'iosApp/**'
      - 'shared/**'
      - 'server/**'
      - 'fixtures/**'
      - 'gradle/**'
      - '*.gradle.kts'
      - 'gradle.properties'
      - '.github/workflows/ios.yml'
  pull_request:
    paths:
      - 'iosApp/**'
      - 'shared/**'
      - 'server/**'
      - 'fixtures/**'
      - 'gradle/**'
      - '*.gradle.kts'
      - 'gradle.properties'
      - '.github/workflows/ios.yml'
  workflow_dispatch:

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Top of Kotlin 2.4.21's tested range; the image's default Xcode (26.6) is newer than that.
  XCODE_APP: /Applications/Xcode_26.4.1.app
  # Must match the version used to generate the committed project (see iosApp/project.yml).
  XCODEGEN_VERSION: 2.46.0

jobs:
  ios:
    name: iOS build and UI tests (macOS)
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - name: Select Xcode
        run: |
          sudo xcode-select -s "$XCODE_APP"
          xcodebuild -version

      - name: Install XcodeGen
        run: |
          curl -fsSL -o "$RUNNER_TEMP/xcodegen.zip" \
            "https://github.com/yonaskolb/XcodeGen/releases/download/$XCODEGEN_VERSION/xcodegen.zip"
          unzip -q "$RUNNER_TEMP/xcodegen.zip" -d "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/xcodegen/bin" >> "$GITHUB_PATH"

      - name: Check the committed Xcode project matches project.yml
        run: |
          xcodegen --version
          xcodegen generate --spec iosApp/project.yml
          if [ -n "$(git status --porcelain -- iosApp)" ]; then
            echo "::error::iosApp/RoameStarter.xcodeproj is out of date. Run 'xcodegen generate --spec iosApp/project.yml' and commit the result."
            git status --porcelain -- iosApp
            git diff -- iosApp | head -200
            exit 1
          fi

      # The Xcode build phase runs Gradle; JDK 25 matches gradle/gradle-daemon-jvm.properties.
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'

      - uses: gradle/actions/setup-gradle@v6

      - name: Cache the Kotlin/Native toolchain
        uses: actions/cache@v6
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ runner.arch }}-kotlin-2.4.21

      - name: Create and boot the simulator (iPhone 17, iOS 26.4)
        id: sim
        run: |
          RUNTIME=$(xcrun simctl list runtimes -j | jq -r '[.runtimes[] | select(.platform == "iOS" and .isAvailable and (.version | startswith("26.4")))][0].identifier')
          if [ -z "$RUNTIME" ] || [ "$RUNTIME" = "null" ]; then
            echo "::error::No iOS 26.4 simulator runtime on this image"
            xcrun simctl list runtimes
            exit 1
          fi
          UDID=$(xcrun simctl create ci-iphone "iPhone 17" "$RUNTIME")
          echo "runtime=$RUNTIME udid=$UDID"
          xcrun simctl boot "$UDID"
          xcrun simctl bootstatus "$UDID" -b
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"

      - name: Build for testing
        env:
          UDID: ${{ steps.sim.outputs.udid }}
        run: |
          set -o pipefail
          mkdir -p build/ci
          xcodebuild build-for-testing -project iosApp/RoameStarter.xcodeproj -scheme RoameStarter \
            -configuration Debug -destination "id=$UDID" -derivedDataPath build/dd \
            | tee build/ci/build-for-testing.log | xcbeautify --renderer github-actions

      - name: UI tests
        env:
          UDID: ${{ steps.sim.outputs.udid }}
        run: |
          set -o pipefail
          xcodebuild test-without-building -project iosApp/RoameStarter.xcodeproj -scheme RoameStarter \
            -destination "id=$UDID" -derivedDataPath build/dd \
            -resultBundlePath build/ci/ui-tests.xcresult \
            | tee build/ci/ui-tests.log | xcbeautify --renderer github-actions

      - name: Export screenshots
        if: always()
        run: |
          if [ -d build/ci/ui-tests.xcresult ]; then
            mkdir -p build/ci/screenshots
            xcrun xcresulttool export attachments --path build/ci/ui-tests.xcresult \
              --output-path build/ci/screenshots
          fi

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ios-ui-tests
          path: |
            build/ci/*.log
            build/ci/*.xcresult
            build/ci/screenshots
          if-no-files-found: ignore
          retention-days: 14
